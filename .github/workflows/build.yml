name: Build Winlator APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check app contents
        run: find ./app -maxdepth 4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle files if missing
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Winlator"
          include ':app'
          EOF
          fi
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF
          fi
          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.winlator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.winlator"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF
          fi

      - name: Build APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Winlator-APK
          path: "**/build/outputs/apk/debug/*.apk"
